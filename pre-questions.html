<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정보처리기사 실기 기출문제 풀이</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

:root{
  --blue:#0064FF;
  --blue-dark:#0050CC;
  --blue-soft:#EAF1FF;
  --ink:#191F28;
  --gray:#8B95A1;
  --line:#E5E8EB;
  --bg:#FFFFFF;
  --soft:#F2F4F6;
  --green:#00B26A;
  --red:#F04452;
  --green-soft:#E7F8F0;
  --red-soft:#FEECEE;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  color:var(--ink);
  line-height:1.6;
  word-break:keep-all;
}
.wrap{max-width:680px;margin:0 auto;padding:0 20px 64px;min-height:100dvh}
.screen{display:none;animation:fade .35s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* header */
header{padding:40px 0 28px}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--blue);background:var(--blue-soft);padding:6px 12px;border-radius:999px;letter-spacing:-.2px}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--blue)}
h1{font-size:28px;font-weight:800;letter-spacing:-1px;margin:18px 0 8px;line-height:1.3}
.sub{color:var(--gray);font-size:15px}

/* section label */
.label{font-size:13px;font-weight:700;color:var(--gray);letter-spacing:-.2px;margin:32px 0 12px;display:flex;align-items:center;gap:8px}
.label b{color:var(--blue);font-size:13px}

/* count grid */
.count-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.count-grid .opt{
  border:1.5px solid var(--line);background:#fff;border-radius:16px;
  padding:18px 0;text-align:center;cursor:pointer;transition:.15s;font-weight:700;
}
.count-grid .opt .n{font-size:24px;letter-spacing:-1px}
.count-grid .opt .u{font-size:12px;color:var(--gray);font-weight:600;margin-top:2px}

/* subject list */
.subj-list{display:flex;flex-direction:column;gap:10px}
.subj-list .opt{
  border:1.5px solid var(--line);background:#fff;border-radius:16px;
  padding:16px 18px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:14px;
}
.subj-list .opt .ico{width:38px;height:38px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.subj-list .opt .t{font-weight:700;font-size:16px;letter-spacing:-.3px}
.subj-list .opt .c{font-size:13px;color:var(--gray);font-weight:500;margin-top:1px}
.subj-list .opt .chk{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;position:relative;transition:.15s}

.opt:hover{border-color:#C9D2DC}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.subj-list .opt.sel .ico{background:var(--blue);color:#fff}
.subj-list .opt.sel .chk{border-color:var(--blue);background:var(--blue)}
.subj-list .opt.sel .chk::after{content:"";position:absolute;left:6px;top:2.5px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}

/* primary button */
.btn{
  width:100%;border:none;background:var(--blue);color:#fff;font-family:inherit;
  font-weight:700;font-size:17px;padding:17px;border-radius:16px;cursor:pointer;
  transition:.15s;letter-spacing:-.3px;
}
.btn:hover{background:var(--blue-dark)}
.btn:active{transform:scale(.985)}
.btn:disabled{background:var(--soft);color:var(--gray);cursor:not-allowed;transform:none}
.btn-ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn-ghost:hover{background:var(--blue-soft)}
.btn-line{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn-line:hover{background:var(--soft)}
.cta-fixed{position:sticky;bottom:0;padding:16px 0 calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,#fff 70%,transparent)}

/* progress */
.qhead{padding:28px 0 10px;display:flex;align-items:center;justify-content:space-between}
.qhead .count{font-weight:800;font-size:15px;letter-spacing:-.3px}
.qhead .count em{color:var(--blue);font-style:normal}
.qhead .count span{color:var(--gray);font-weight:600}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s cubic-bezier(.2,.8,.2,1)}

/* question card */
.qcard{padding:28px 0 8px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:5px 11px;border-radius:8px;letter-spacing:-.2px}
.qtext{font-size:19px;font-weight:600;letter-spacing:-.4px;margin:16px 0 4px;line-height:1.55}
pre.code{
  background:#1A1F2B;color:#E6EDF3;border-radius:14px;padding:18px;overflow-x:auto;
  font-family:'JetBrains Mono','D2Coding',ui-monospace,Menlo,Consolas,monospace;
  font-size:13.5px;line-height:1.7;margin:16px 0 4px;letter-spacing:0;
}
.hint{font-size:13px;color:var(--gray);margin-top:10px}

.ans-block{margin-top:22px}
.ans-block label{display:block;font-size:13px;font-weight:700;color:var(--gray);margin-bottom:8px}
.ans-input{
  width:100%;border:1.5px solid var(--line);border-radius:14px;padding:16px;
  font-family:inherit;font-size:17px;color:var(--ink);transition:.15s;background:#fff;
}
.ans-input:focus{outline:none;border-color:var(--blue);background:#fff}
.ans-input::placeholder{color:#B0B8C1}
.ans-input.locked{background:var(--soft);color:var(--gray)}

.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1}

/* feedback */
.feedback{margin-top:20px;border-radius:16px;padding:20px;animation:fade .3s;display:none}
.feedback.show{display:block}
.feedback.correct{background:var(--green-soft)}
.feedback.wrong{background:var(--red-soft)}
.fb-head{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.3px}
.feedback.correct .fb-head{color:var(--green)}
.feedback.wrong .fb-head{color:var(--red)}
.fb-badge{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.feedback.correct .fb-badge{background:var(--green)}
.feedback.wrong .fb-badge{background:var(--red)}
.fb-ans{margin-top:14px;font-size:15px}
.fb-ans .k{font-size:12px;font-weight:700;color:var(--gray);display:block;margin-bottom:3px}
.fb-ans .v{font-weight:700;font-size:16px;color:var(--ink);letter-spacing:-.3px}
.fb-exp{margin-top:14px;padding-top:14px;border-top:1px solid rgba(0,0,0,.07);font-size:14.5px;color:#4A5560;line-height:1.65}

/* result */
.result-hero{text-align:center;padding:44px 0 8px}
.donut{width:180px;height:180px;margin:0 auto 8px;position:relative}
.donut svg{transform:rotate(-90deg)}
.donut .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .pct b{font-size:44px;font-weight:800;letter-spacing:-2px;line-height:1}
.donut .pct span{font-size:13px;color:var(--gray);font-weight:600;margin-top:4px}
.result-msg{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-top:18px}
.result-sub{color:var(--gray);font-size:15px;margin-top:6px}
.score-row{display:flex;gap:10px;margin-top:26px}
.score-box{flex:1;background:var(--soft);border-radius:16px;padding:18px;text-align:center}
.score-box b{font-size:24px;font-weight:800;letter-spacing:-1px;display:block}
.score-box.ok b{color:var(--green)}
.score-box.no b{color:var(--red)}
.score-box span{font-size:12px;color:var(--gray);font-weight:600}

.review-title{font-size:17px;font-weight:800;letter-spacing:-.4px;margin:38px 0 14px;display:flex;align-items:center;gap:8px}
.review-title .cnt{font-size:13px;color:#fff;background:var(--red);border-radius:99px;padding:2px 9px;font-weight:700}
.rev-card{border:1.5px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.rev-card .tag{margin-bottom:10px}
.rev-q{font-weight:600;font-size:15.5px;letter-spacing:-.3px;line-height:1.5}
.rev-q pre.code{font-size:12.5px;padding:14px;margin:12px 0 0}
.rev-meta{margin-top:12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.rev-meta .line{display:flex;gap:8px}
.rev-meta .line .k{flex-shrink:0;font-weight:700;width:52px;font-size:13px}
.rev-meta .your{color:var(--red)}
.rev-meta .yours .k{color:var(--red)}
.rev-meta .right{color:var(--green)}
.rev-meta .rights .k{color:var(--green)}
.rev-exp{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:#4A5560;line-height:1.65}
.all-correct{text-align:center;background:var(--green-soft);border-radius:16px;padding:28px;color:var(--green);font-weight:700;font-size:16px;margin-top:30px}

@media(max-width:420px){
  h1{font-size:25px}
  .count-grid{gap:8px}
  .count-grid .opt .n{font-size:21px}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 시작 화면 ===== -->
  <section class="screen active" id="home">
    <header>
      <span class="brand"><span class="dot"></span>정보처리기사 실기</span>
      <h1>기출문제 풀이</h1>
      <p class="sub">과목과 문제 수를 고르고 실전처럼 풀어보세요.</p>
    </header>

    <div class="label">문제 수 <b id="cntLabel"></b></div>
    <div class="count-grid" id="countGrid"></div>

    <div class="label">과목 선택</div>
    <div class="subj-list" id="subjList"></div>

    <div class="cta-fixed">
      <button class="btn" id="startBtn" disabled>확인</button>
    </div>
  </section>

  <!-- ===== 문제 화면 ===== -->
  <section class="screen" id="quiz">
    <div class="qhead">
      <div class="count"><em id="curNum">1</em><span id="totNum"> / 10</span></div>
      <div class="count" style="color:var(--gray);font-weight:600" id="subjNow"></div>
    </div>
    <div class="bar"><i id="progBar" style="width:0%"></i></div>

    <div class="qcard">
      <span class="tag" id="qTag">과목</span>
      <div class="qtext" id="qText"></div>
      <div id="qCode"></div>

      <div class="ans-block">
        <label for="ansInput">정답 입력</label>
        <input class="ans-input" id="ansInput" type="text" autocomplete="off" placeholder="답을 입력하세요" />
      </div>

      <div class="btn-row">
        <button class="btn btn-line" id="checkBtn">확인</button>
        <button class="btn" id="nextBtn" disabled>다음</button>
      </div>

      <div class="feedback" id="feedback">
        <div class="fb-head"><span class="fb-badge" id="fbBadge"></span><span id="fbTitle"></span></div>
        <div class="fb-ans"><span class="k">정답</span><span class="v" id="fbAns"></span></div>
        <div class="fb-exp" id="fbExp"></div>
      </div>
    </div>
  </section>

  <!-- ===== 결과 화면 ===== -->
  <section class="screen" id="result">
    <div class="result-hero">
      <div class="donut">
        <svg width="180" height="180" viewBox="0 0 180 180">
          <circle cx="90" cy="90" r="78" fill="none" stroke="#F2F4F6" stroke-width="16"/>
          <circle id="donutArc" cx="90" cy="90" r="78" fill="none" stroke="#0064FF" stroke-width="16"
                  stroke-linecap="round" stroke-dasharray="490" stroke-dashoffset="490"/>
        </svg>
        <div class="pct"><b id="pctNum">0%</b><span>정답률</span></div>
      </div>
      <div class="result-msg" id="resMsg"></div>
      <div class="result-sub" id="resSub"></div>
      <div class="score-row">
        <div class="score-box ok"><b id="okCnt">0</b><span>맞은 문제</span></div>
        <div class="score-box no"><b id="noCnt">0</b><span>틀린 문제</span></div>
      </div>
    </div>

    <div id="reviewWrap"></div>

    <div class="cta-fixed" style="margin-top:24px">
      <button class="btn" id="restartBtn">처음으로</button>
    </div>
  </section>

</div>

<script>
/* ===================== 문제 은행 ===================== */
const BANK = [
{
"s": "프로그래밍 언어 활용",
"q": "다음 C 코드의 출력 결과를 쓰시오.",
"a": [
"80"
],
"e": "포인터 p가 배열 a의 시작을 가리키므로 *(p+2)=30, *(p+4)=50. 합은 80입니다.",
"code": "#include <stdio.h>\nint main() {\n    int a[] = {10, 20, 30, 40, 50};\n    int *p = a;\n    printf(\"%d\", *(p + 2) + *(p + 4));\n    return 0;\n}"
},
{
"s": "프로그래밍 언어 활용",
"q": "다음 C 코드의 출력 결과를 쓰시오.",
"a": [
"Lee 38",
"lee 38"
],
"e": "구조체 배열 포인터 p가 a를 가리킨 뒤 p++로 두 번째 원소를 가리킵니다. p->name은 Lee, p->age는 38입니다.",
"code": "#include <stdio.h>\nstruct st { char name[10]; int age; };\nint main() {\n    struct st a[] = {{\"Kim\", 28}, {\"Lee\", 38}, {\"Park\", 42}};\n    struct st *p = a;\n    p++;\n    printf(\"%s %d\", p->name, p->age);\n    return 0;\n}"
},
{
"s": "프로그래밍 언어 활용",
"q": "다음 C 코드의 출력 결과를 쓰시오.",
"a": [
"20 10"
],
"e": "swap 함수에 변수의 주소(&a, &b)를 넘기는 참조 호출이므로 원본 a와 b가 교환됩니다.",
"code": "#include <stdio.h>\nvoid swap(int *x, int *y) {\n    int t = *x;\n    *x = *y;\n    *y = t;\n}\nint main() {\n    int a = 10, b = 20;\n    swap(&a, &b);\n    printf(\"%d %d\", a, b);\n    return 0;\n}"
},
{
"s": "프로그래밍 언어 활용",
"q": "다음 C 코드의 출력 결과를 쓰시오.",
"a": [
"15"
],
"e": "a[i][i]는 주대각선 원소 1, 5, 9의 합입니다. 1+5+9 = 15.",
"code": "#include <stdio.h>\nint main() {\n    int a[3][3] = {{1,2,3},{4,5,6},{7,8,9}};\n    int sum = 0;\n    for (int i = 0; i < 3; i++)\n        sum += a[i][i];\n    printf(\"%d\", sum);\n    return 0;\n}"
},
{
"s": "프로그래밍 언어 활용",
"q": "다음 C 코드의 출력 결과를 쓰시오.",
"a": [
"2 7 5"
],
"e": "6=110, 3=011. 비트 AND=010(2), OR=111(7), XOR=101(5).",
"code": "#include <stdio.h>\nint main() {\n    int a = 6, b = 3;\n    printf(\"%d %d %d\", a & b, a | b, a ^ b);\n    return 0;\n}"
},
{
"s": "프로그래밍 언어 활용",
"q": "다음 C 코드의 출력 결과를 쓰시오.",
"a": [
"4321"
],
"e": "n%10으로 끝자리를 떼어 r에 누적하며 자릿수를 뒤집습니다. 1234 → 4321.",
"code": "#include <stdio.h>\nint main() {\n    int n = 1234, r = 0;\n    while (n > 0) {\n        r = r * 10 + n % 10;\n        n = n / 10;\n    }\n    printf(\"%d\", r);\n    return 0;\n}"
},
{
"s": "프로그래밍 언어 활용",
"q": "다음 C 코드의 출력 결과를 쓰시오.",
"a": [
"120"
],
"e": "재귀로 5! = 5×4×3×2×1 = 120을 계산합니다.",
"code": "#include <stdio.h>\nint func(int n) {\n    if (n <= 1) return 1;\n    return n * func(n - 1);\n}\nint main() {\n    printf(\"%d\", func(5));\n    return 0;\n}"
},
{
"s": "프로그래밍 언어 활용",
"q": "다음 C 코드의 출력 결과를 쓰시오.",
"a": [
"6 3 5"
],
"e": "a>b가 참이라 c=a++가 실행됩니다. 후위증가라 c엔 5가 대입된 뒤 a가 6이 되고 b는 그대로 3입니다.",
"code": "#include <stdio.h>\nint main() {\n    int a = 5, b = 3, c;\n    c = (a > b) ? a++ : b++;\n    printf(\"%d %d %d\", a, b, c);\n    return 0;\n}"
},
{
"s": "프로그래밍 언어 활용",
"q": "다음 C 코드의 출력 결과를 쓰시오.",
"a": [
"47"
],
"e": "1~100 중 3 또는 5의 배수 개수입니다. 33(3배수)+20(5배수)-6(15배수)=47.",
"code": "#include <stdio.h>\nint main() {\n    int c = 0;\n    for (int i = 1; i <= 100; i++)\n        if (i % 3 == 0 || i % 5 == 0) c++;\n    printf(\"%d\", c);\n    return 0;\n}"
},
{
"s": "프로그래밍 언어 활용",
"q": "다음 C 코드의 출력 결과를 쓰시오.",
"a": [
"11"
],
"e": "문자열 끝 '\\0'을 만날 때까지 i를 증가시켜 길이를 셉니다. \"Information\"의 길이는 11입니다.",
"code": "#include <stdio.h>\nint main() {\n    char str[] = \"Information\";\n    int i = 0;\n    while (str[i] != '\\0') i++;\n    printf(\"%d\", i);\n    return 0;\n}"
},
{
"s": "프로그래밍 언어 활용",
"q": "다음 Java 코드의 출력 결과를 쓰시오.",
"a": [
"10, 20"
],
"e": "필드(x)는 참조변수의 타입(A) 기준으로 정적 바인딩되어 obj.x=10, 메소드는 실제 객체(B)로 동적 바인딩되어 get()=20입니다.",
"code": "public class Main {\n    public static void main(String[] args) {\n        A obj = new B();\n        System.out.print(obj.x + \", \" + obj.get());\n    }\n}\nclass A {\n    int x = 10;\n    int get() { return x; }\n}\nclass B extends A {\n    int x = 20;\n    int get() { return x; }\n}"
},
{
"s": "프로그래밍 언어 활용",
"q": "다음 Java 코드의 출력 결과를 쓰시오.",
"a": [
"20"
],
"e": "makeArr는 a[i]=i*i인 배열을 반환합니다. a[2]=4, a[4]=16이므로 합은 20입니다.",
"code": "public class Main {\n    static int[] makeArr() {\n        int[] a = new int[5];\n        for (int i = 0; i < 5; i++) a[i] = i * i;\n        return a;\n    }\n    public static void main(String[] args) {\n        int[] a = makeArr();\n        System.out.print(a[2] + a[4]);\n    }\n}"
},
{
"s": "프로그래밍 언어 활용",
"q": "다음 Java 코드의 출력 결과를 쓰시오.",
"a": [
"Info11"
],
"e": "substring(0,4)는 인덱스 0~3인 \"Info\", length()는 11이므로 연결하면 Info11입니다.",
"code": "public class Main {\n    public static void main(String[] args) {\n        String s = \"Information\";\n        System.out.print(s.substring(0, 4) + s.length());\n    }\n}"
},
{
"s": "프로그래밍 언어 활용",
"q": "다음 Java 코드의 출력 결과를 쓰시오.",
"a": [
"30"

/* 과목 메타 */
const SUBJECTS = [
  {name:"전체",            icon:"📚", all:true},
  {name:"소프트웨어 설계",   icon:"✏️"},
  {name:"소프트웨어 개발",   icon:"🧩"},
  {name:"데이터베이스 구축", icon:"🗄️"},
  {name:"프로그래밍 언어 활용", icon:"💻"},
  {name:"정보시스템 구축관리", icon:"🔐"},
];
const COUNTS = [5,10,15,20];

/* ===================== Repository ===================== */
const QuestionRepository = (() => {
  return {
    getAll: () => BANK.slice(),
    getBySubject: name => BANK.filter(x => x.s === name),
    getPool: subjectName => {
      const s = SUBJECTS.find(x => x.name === subjectName);
      return s && s.all ? BANK.slice() : BANK.filter(x => x.s === subjectName);
    },
    getSubjects: () => SUBJECTS,
    getCounts: () => COUNTS,
  };
})();

/* ===================== State ===================== */
const AppState = (() => {
  let sel = { count: null, subject: null };
  let quiz = { list: [], idx: 0, results: [] };
  return {
    getSel: () => sel,
    getQuiz: () => quiz,
    setSel: patch => { sel = { ...sel, ...patch }; },
    setQuiz: q => { quiz = q; },
    resetSel: () => { sel = { count: null, subject: null }; },
  };
})();

/* ===================== QuizService ===================== */
const QuizService = (() => {
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function normalize(s) {
    return (s || "").toString().toLowerCase()
      .replace(/\s+/g, "")
      .replace(/[()[\]{}.,·•\-_/"”"””]/g, "")
      .trim();
  }
  function isCorrect(user, answers) {
    const u = normalize(user);
    if (!u) return false;
    return answers.some(a => normalize(a) === u);
  }
  function buildQuizList(subjectName, count) {
    const pool = shuffle(QuestionRepository.getPool(subjectName));
    return pool.slice(0, Math.min(count, pool.length));
  }
  return { isCorrect, buildQuizList };
})();

/* ===================== UI ===================== */
const UI = (() => {
  const $ = id => document.getElementById(id);
  function show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    $(id).classList.add("active");
    window.scrollTo({ top: 0, behavior: "instant" });
  }
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  return { $, show, escapeHtml };
})();

/* ===================== HomeView ===================== */
const HomeView = (() => {
  const { $ } = UI;
  function render() {
    const sel = AppState.getSel();
    const cg = $("countGrid");
    cg.innerHTML = "";
    QuestionRepository.getCounts().forEach(n => {
      const d = document.createElement("div");
      d.className = "opt" + (sel.count === n ? " sel" : "");
      d.innerHTML = `<div class=”n”>${n}</div><div class=”u”>문제</div>`;
      d.onclick = () => { AppState.setSel({ count: n }); render(); refreshStart(); };
      cg.appendChild(d);
    });
    const sl = $("subjList");
    sl.innerHTML = "";
    QuestionRepository.getSubjects().forEach(sub => {
      const cnt = sub.all ? QuestionRepository.getAll().length : QuestionRepository.getBySubject(sub.name).length;
      const d = document.createElement("div");
      d.className = "opt" + (sel.subject === sub.name ? " sel" : "");
      d.innerHTML = `<div class=”ico”>${sub.icon}</div>
        <div><div class=”t”>${sub.name}</div><div class=”c”>${cnt}문제 보유</div></div>
        <div class=”chk”></div>`;
      d.onclick = () => { AppState.setSel({ subject: sub.name }); render(); refreshStart(); };
      sl.appendChild(d);
    });
  }
  function refreshStart() {
    const sel = AppState.getSel();
    const ok = sel.count && sel.subject;
    $("startBtn").disabled = !ok;
    if (ok) {
      const pool = QuestionRepository.getPool(sel.subject);
      const real = Math.min(sel.count, pool.length);
      $("cntLabel").textContent = real < sel.count
        ? `· 선택 과목 보유 ${pool.length}문제 (요청 ${sel.count} → ${real}문제로 출제)` : "";
      $("startBtn").textContent = `${real}문제 풀기 시작`;
    } else {
      $("cntLabel").textContent = "";
      $("startBtn").textContent = "확인";
    }
  }
  return { render, refreshStart };
})();

/* ===================== QuizView ===================== */
const QuizView = (() => {
  const { $, escapeHtml } = UI;
  function renderQuestion() {
    const { list, idx } = AppState.getQuiz();
    const q = list[idx];
    const total = list.length;
    $("curNum").textContent = idx + 1;
    $("totNum").textContent = ` / ${total}`;
    $("subjNow").textContent = AppState.getSel().subject === "전체" ? q.s : "";
    $("progBar").style.width = (idx / total * 100) + "%";
    $("qTag").textContent = q.s;
    $("qText").textContent = q.q;
    $("qCode").innerHTML = q.code ? `<pre class=”code”>${escapeHtml(q.code)}</pre>` : "";
    const inp = $("ansInput");
    inp.value = ""; inp.disabled = false; inp.classList.remove("locked");
    inp.placeholder = "답을 입력하세요";
    $("feedback").className = "feedback";
    $("checkBtn").disabled = false;
    $("checkBtn").style.display = "";
    $("nextBtn").disabled = true;
    $("nextBtn").textContent = (idx === total - 1) ? "결과 보기" : "다음";
    setTimeout(() => inp.focus(), 100);
  }
  function showFeedback(correct, answer, explanation) {
    const fb = $("feedback");
    fb.className = "feedback show " + (correct ? "correct" : "wrong");
    $("fbBadge").textContent = correct ? "✓" : "✕";
    $("fbTitle").textContent = correct ? "정답입니다!" : "오답입니다";
    $("fbAns").textContent = answer;
    $("fbExp").textContent = explanation;
    fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  function lockInput() {
    const inp = $("ansInput");
    inp.disabled = true;
    inp.classList.add("locked");
    $("checkBtn").disabled = true;
    $("checkBtn").style.display = "none";
    $("nextBtn").disabled = false;
  }
  return { renderQuestion, showFeedback, lockInput };
})();

/* ===================== ResultView ===================== */
const ResultView = (() => {
  const { $, escapeHtml } = UI;
  function _animateDonut(pct) {
    const circ = 490;
    const arc = $("donutArc");
    arc.style.transition = "none";
    arc.style.strokeDashoffset = circ;
    arc.setAttribute("stroke", pct >= 80 ? "#00B26A" : pct >= 50 ? "#0064FF" : "#F04452");
    $("pctNum").style.color = pct >= 80 ? "#00B26A" : pct >= 50 ? "#0064FF" : "#F04452";
    let cur = 0;
    setTimeout(() => {
      arc.style.transition = "stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)";
      arc.style.strokeDashoffset = circ * (1 - pct / 100);
    }, 80);
    const timer = setInterval(() => {
      cur += Math.max(1, Math.ceil((pct - cur) / 8));
      if (cur >= pct) { cur = pct; clearInterval(timer); }
      $("pctNum").textContent = cur + "%";
    }, 22);
  }
  function _renderMessage(pct) {
    let msg, sub;
    if (pct === 100)    { msg = "완벽합니다! 🎉"; sub = "모든 문제를 맞혔어요."; }
    else if (pct >= 80) { msg = "아주 좋아요!"; sub = "합격 안정권 수준이에요."; }
    else if (pct >= 60) { msg = "잘하고 있어요"; sub = "조금만 더 다지면 충분해요."; }
    else if (pct >= 40) { msg = "기초를 다질 시간"; sub = "틀린 문제 해설을 꼭 복습하세요."; }
    else                { msg = "복습이 필요해요"; sub = "해설을 보며 개념부터 정리해 보세요."; }
    $("resMsg").textContent = msg;
    $("resSub").textContent = sub;
  }
  function _renderReview(noList) {
    const rw = $("reviewWrap");
    if (noList.length === 0) {
      rw.innerHTML = `<div class=”all-correct”>틀린 문제가 없습니다.<br>다음 과목도 도전해 보세요! 💪</div>`;
      return;
    }
    let html = `<div class=”review-title”>틀린 문제 다시보기 <span class=”cnt”>${noList.length}</span></div>`;
    noList.forEach(r => {
      html += `<div class=”rev-card”>
        <span class=”tag”>${r.q.s}</span>
        <div class=”rev-q”>${escapeHtml(r.q.q)}${r.q.code ? `<pre class=”code”>${escapeHtml(r.q.code)}</pre>` : ""}</div>
        <div class=”rev-meta”>
          <div class=”line yours”><span class=”k”>내 답</span><span class=”your”>${escapeHtml(r.user) || "(미입력)"}</span></div>
          <div class=”line rights”><span class=”k”>정답</span><span class=”right”>${escapeHtml(r.q.a[0])}</span></div>
        </div>
        <div class=”rev-exp”>${escapeHtml(r.q.e)}</div>
      </div>`;
    });
    rw.innerHTML = html;
  }
  function render() {
    const { list, results } = AppState.getQuiz();
    const okList = results.filter(r => r && r.correct);
    const noList = results.filter(r => r && !r.correct);
    const pct = Math.round(okList.length / list.length * 100);
    UI.show("result");
    $("okCnt").textContent = okList.length;
    $("noCnt").textContent = noList.length;
    _animateDonut(pct);
    _renderMessage(pct);
    _renderReview(noList);
  }
  return { render };
})();

/* ===================== App ===================== */
const App = (() => {
  const { $ } = UI;
  function startQuiz() {
    const sel = AppState.getSel();
    AppState.setQuiz({ list: QuizService.buildQuizList(sel.subject, sel.count), idx: 0, results: [] });
    UI.show("quiz");
    QuizView.renderQuestion();
  }
  function checkAnswer() {
    const quiz = AppState.getQuiz();
    const q = quiz.list[quiz.idx];
    const inp = $("ansInput");
    const user = inp.value.trim();
    if (!user) { inp.focus(); return; }
    const correct = QuizService.isCorrect(user, q.a);
    if (!quiz.results[quiz.idx]) {
      quiz.results[quiz.idx] = { q, user, correct };
    }
    QuizView.lockInput();
    QuizView.showFeedback(correct, q.a[0], q.e);
  }
  function nextQuestion() {
    const quiz = AppState.getQuiz();
    if (quiz.idx === quiz.list.length - 1) {
      ResultView.render();
    } else {
      quiz.idx++;
      QuizView.renderQuestion();
    }
  }
  function restart() {
    AppState.resetSel();
    HomeView.render();
    HomeView.refreshStart();
    UI.show("home");
  }
  function init() {
    $("startBtn").onclick = startQuiz;
    $("checkBtn").onclick = checkAnswer;
    $("nextBtn").onclick = nextQuestion;
    $("restartBtn").onclick = restart;
    $("ansInput").addEventListener("keydown", e => {
      if (e.key === "Enter") {
        if (!$("checkBtn").disabled) checkAnswer();
        else if (!$("nextBtn").disabled) nextQuestion();
      }
    });
    HomeView.render();
    HomeView.refreshStart();
  }
  return { init };
})();

App.init();
</script>
